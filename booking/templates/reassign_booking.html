<h2>Reassign Booking</h2>

<p>Current Tutor: {{ booking.tutor.name }}</p>
<p>Current Slot: {{ booking.slot.date }} - {{ booking.slot.time }}</p>

<form method="POST">
    {% csrf_token %}

    <label>Select New Slot:</label><br><br>

    <select name="slot_id">
        {% for slot in slots %}
            <option value="{{ slot.id }}">
                {{ slot.tutor.name }} - {{ slot.date }} - {{ slot.time }}
            </option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Reassign</button>
</form>
