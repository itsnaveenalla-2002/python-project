<h2>All Slots</h2>

<table border="1">
<tr>
    <th>Tutor</th>
    <th>Date</th>
    <th>Time</th>
    <th>Status</th>
</tr>

{% for slot in slots %}
<tr>
    <td>{{ slot.tutor_id }}</td>
    <td>{{ slot.date }}</td>
    <td>{{ slot.time }}</td>
    <td>
        {% if slot.is_booked %}Booked{% else %}Available{% endif %}
    </td>
</tr>
{% endfor %}
</table>
