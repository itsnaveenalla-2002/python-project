<h2>All Users</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Action</th>
</tr>

{% for user in users %}
<tr>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.role }}</td>
    <td>
        <a href="/dashboard/delete-user/{{ user.id }}/">Delete</a>
    </td>


</tr>
{% endfor %}

</table>
